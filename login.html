
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillUp | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <header class="header">
        <nav class="navbar">
            <a href="index.html" class="logo">Skill<span>Up.</span></a>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="register.html">Register</a></li>
                <li><a href="Booking.html">Booking</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>

            <a href="login.html" class="nav-btn">Login</a>
        </nav>
    </header>

    <!-- Login Section -->
    <main class="login-page">

        <section class="login-card">

            <div class="login-icon">✦</div>

            <p class="subtitle">WELCOME BACK</p>

            <h1>Login to <span>SkillUp.</span></h1>

            <p class="login-description">
                Continue your learning journey with us.
            </p>

            <form class="login-form">

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="login-submit">
                    Login to Your Account
                </button>

            </form>

            <p class="login-note">
                Ready to learn something new? Your journey starts here.
            </p>

            <a href="index.html" class="back-home">
                ← Back to Home
            </a>

        </section>

    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>© 2026 SkillUp. Keep learning, keep growing.</p>
    </footer>

</body>
</html>
